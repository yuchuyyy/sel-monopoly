<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>情緒領航員 — SEL大富翁 (PeerJS 無資料庫版)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#040C18;--sf:#0B1A2E;--sf2:#0F2238;
  --bd:rgba(0,210,255,.2);--r:12px;--rs:8px;
  --t0:#00BFFF;--t1:#FF6B9D;--t2:#4DDD80;--t3:#FFD700;
  --ca:#00D4FF;--ca-d:rgba(0,212,255,.12);
  --cs:#FFB347;--cs-d:rgba(255,179,71,.12);
  --cc:#9B6DFF;--cc-d:rgba(155,109,255,.12);
  --gr:#2ED573;--re:#FF4757;--tx:#E8F4FD;--mu:rgba(232,244,253,.5);
  --font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans CJK TC",sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--font-family);overflow:hidden}

/* 角色選單、大螢幕、學生端通用排版 */
.view-panel{display:none;width:100%;height:100%;padding:20px;flex-direction:column;overflow-y:auto}
.view-panel.active{display:flex}

.title-main{text-align:center;font-size:24px;margin-bottom:20px;letter-spacing:1px;color:#fff;text-shadow:0 0 10px rgba(0,191,255,0.5)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:20px;margin-bottom:15px;box-shadow:0 8px 32px rgba(0,0,0,0.3)}

/* 選擇角色畫面 */
.role-grid{display:grid;grid-template-columns:1fr;gap:15px;margin-top:20px}
@media(min-width:600px){.role-grid{grid-template-columns:1fr 1fr}}
.btn{background:var(--sf2);border:1px solid var(--bd);color:var(--tx);padding:18px;border-radius:var(--rs);font-size:18px;font-weight:bold;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:hover{background:var(--bd);transform:translateY(-2px)}
.btn-primary{background:linear-gradient(135deg, #00BFFF, #0056b3);border:none}

/* 大螢幕排版 */
.screen-layout{display:grid;grid-template-columns:1fr 320px;gap:20px;height:calc(100% - 60px)}
.main-board-area{display:flex;flex-direction:column;justify-content:space-between}
.room-id-tag{background:rgba(0,191,255,0.15);border:1px dashed var(--t0);padding:10px;border-radius:var(--rs);text-align:center;font-size:18px;color:var(--t0);margin-bottom:15px;font-family:monospace}

/* 簡易線性大富翁地圖 */
.map-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.grid-box{flex:0 0 100px;height:100px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);padding:8px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.grid-box.ACTION{border-color:var(--ca);background:var(--ca-d)}
.grid-box.CHALLENGE{border-color:var(--cc);background:var(--cc-d)}
.grid-box.STOP{border-color:var(--re);background:rgba(255,71,87,0.1)}
.grid-box b{font-size:12px;display:block;text-align:center}
.token-slot{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.p-token{width:12px;height:12px;border-radius:50%;box-shadow:0 0 5px rgba(255,255,255,0.8)}

/* 大螢幕右側面板 */
.side-panel{display:flex;flex-direction:column;gap:15px}
.score-row{display:flex;justify-content:between;align-items:center;padding:10px;background:var(--sf2);border-radius:var(--rs);border-left:4px solid var(--tx)}
.dice-box{font-size:48px;text-align:center;margin:15px 0}

/* 學生端控制排版 */
.stu-ctrl-zone{text-align:center;padding:30px 10px}
.dice-btn-big{width:120px;height:120px;border-radius:50%;font-size:48px;margin:20px auto;background:linear-gradient(135deg,#FFB347,#e67e22);border:none;color:#fff;box-shadow:0 0 20px rgba(255,179,71,0.4);cursor:pointer;display:flex;align-items:center;justify-content:center}
.dice-btn-big:disabled{background:#555;box-shadow:none;cursor:not-allowed}
.status-banner{background:rgba(255,255,255,0.05);padding:15px;border-radius:var(--rs);margin-top:20px;font-size:16px;line-height:1.6}

/* 遮罩彈窗（評審與卡牌呈現） */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(4,12,24,0.85);backdrop-filter:blur(5px);display:none;justify-content:center;align-items:center;z-index:999;padding:20px}
.modal-overlay.active{display:flex}
.modal-card{background:var(--sf);border:2px solid var(--bd);border-radius:var(--r);padding:30px;max-width:550px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.5);text-align:center}
